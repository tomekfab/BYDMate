name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5

      # PR-only: pushes to main always run the full local suite before release, so running
      # 3.5k tests again on a slow runner is duplicate work. Pull requests do not have that
      # local run, so tests are required there.
      - name: Unit tests
        if: github.event_name == 'pull_request'
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Android Lint
        run: ./gradlew :app:lintDebug --stacktrace

      - name: detekt
        run: ./gradlew :app:detekt --stacktrace

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: app/build/reports/
          retention-days: 14
